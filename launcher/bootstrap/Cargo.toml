[package]
name = "horizon-club-bootstrap"
version = "0.1.0"
edition = "2021"
license = "LGPL-3.0-or-later"
description = "Horizon Club's stable entry point: starts the launcher's current version"

[workspace]

# The file's name is what the share's root holds (the students' shortcut points at it), what
# `club-admin publish --bootstrap` copies it as, and what Windows shows for the process.
[[bin]]
name = "HorizonClub"
path = "src/main.rs"

[profile.release]
opt-level = "s"
strip = true
