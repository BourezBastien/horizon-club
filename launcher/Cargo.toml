[package]
name = "horizon-launcher"
version = "0.4.0"
edition = "2021"
license = "LGPL-3.0-or-later"
description = "The club's launcher: lists its game builds and starts the game, or a server a student hosts"

[workspace]

# The window the students open. The name is what the share's app\<version>\ folder and the
# bootstrap look for (launcher/bootstrap/src/main.rs), and what Windows shows for the process.
[[bin]]
name = "HorizonClubLauncher"
path = "src/main.rs"

# The supervisor's command-line tool for the club's share (docs/school-edition/README.md,
# « Déployer »). It lives in the share's admin\ folder, which students cannot open, and it is
# the only thing that writes in the club root.
[[bin]]
name = "club-admin"
path = "src/bin/club_admin.rs"

[dependencies]
# club-admin's command line (src/bin/club_admin.rs).
clap = { version = "4", features = ["derive"] }
# GPUI Fast (longbridge/gpui-fast): Zed's GPUI with retained views and cached scroll layers, under
# its own name. wgpu renders on Linux, not blade (#3812).
gpui = { package = "gpui-fast", version = "0.1.13" }
gpui_platform = { package = "gpui-fast-platform", version = "0.1.13", features = ["wayland", "x11", "font-kit"] }
ureq = { version = "2", features = ["json", "tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Checks the client jar and the version file found in other launchers' folders (sources.rs).
sha1 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "fs", "io-util", "sync", "time", "macros", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "socks", "stream"] }
futures-util = "0.3"
httpdate = "1"
# A game home's slot is named for the home's path (`windows_runtime::key`).
sha2 = "0.10"
flate2 = "1"
toml = "1.1"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
dirs = "5"
horizon-server-launch = { path = "../crates/horizon-server-launch" }
horizon-theme = { path = "../crates/horizon-theme" }
# The sunset scene, painted skies, rain and frosted glass (`scenery/`).
horizon-launcher-scenery = { path = "scenery" }
# The engine, through the platform's public API (docs/layers.md): the pinned version, the preparer,
# level.dat and servers.dat (the worlds and server lists), and the benchmark report format (`perf`).
horizon-platform = { path = "../crates/horizon-platform", features = ["prepare", "protocol", "world"] }
# Which hosts a proxy address names and which are reached directly (`proxy.rs`).
horizon-port-pack = { path = "../crates/horizon-port-pack" }
# Where the launcher's updates come from: the club's public repository and GitHub's servers (`update`).
horizon-addresses = { path = "../crates/horizon-addresses" }
# Deleting a world moves it to the system's trash
trash = "5"
# Backup names carry the local time, as vanilla's do
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Random download file names (`downloads`).
getrandom = "0.3"
# Players' heads on the Servers page, from the default skins in the player's own game files (already
# in the lockfile through gpui).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
# Home's background is read a row at a time and shrunk as it comes (`pictures`): the version `image` uses.
png = "0.18"

# The game's process group and its signals (`backend`); already in the lockfile.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
# The GPU's texture limit, which caps the pictures made for GPUI's atlas (`pictures::gpu_limit`): the
# wgpu GPUI itself uses on Linux.
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "vulkan", "gles"] }
futures-lite = "2"
[target.'cfg(target_os = "macos")'.dependencies]
# Painting the window's title bar dark or light (titlebar::apply_appearance), and the system's
# reduced motion (sky::moves): crates already in the lockfile through gpui and wgpu.
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSAccessibility", "NSAppearance", "NSView", "NSWindow", "NSWorkspace"] }
raw-window-handle = "0.6"
[target.'cfg(target_os = "windows")'.dependencies]
# Whether a process is still running (`backend::process_alive`), whether the club root was
# given as a mapped drive (`club_admin`'s data-file warning), and the installer's folder picker
# (`club_admin install`); already in the lockfile.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Com", "Win32_System_Console", "Win32_NetworkManagement_WNet", "Win32_NetworkManagement", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }

[target.'cfg(windows)'.build-dependencies]
# The icon resource in the .exe (build.rs).
winresource = "0.1"

[dev-dependencies]
libc = "0.2"
tempfile = "3"
# Tokenize source strings for the translation completeness test, including multiline calls.
syn = "2"
proc-macro2 = "1"
# Headless layout tests: GPUI's test platform draws without a GPU or a real window, and its
# NoopTextSystem shapes deterministically (glass_server_dialog.rs's foot tests).
gpui = { package = "gpui-fast", version = "0.1.13", features = ["test-support"] }

[profile.release]
strip = true

# The scenery's pixel loops (blurring a sky, baking the frosted plates) are optimised in debug
# builds too: unoptimised, one Blur step took 0.7-1 s and one Glass step 70 ms.
[profile.dev.package.horizon-launcher-scenery]
opt-level = 3
